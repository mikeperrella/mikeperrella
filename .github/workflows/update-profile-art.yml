
name: Update Mike's GitHub contribution graph

"on":
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch Mike's contributions
        env:
          GH_PROFILE_USER: mikeperrella
        run: python scripts/fetch_contributions.py

      - name: Generate animated contribution graph
        run: |
          python scripts/generate_streak_svg.py \
            mikeperrella contrib-heatmap.svg

      - name: Commit updated data and graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contributions [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
